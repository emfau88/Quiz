name: Quizsalon im Browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Abhängigkeiten installieren
        run: |
          npm ci
          python -m pip install -r requirements.txt
      - name: Spielregeln und deutschen Fragenkatalog prüfen
        run: |
          npm test
          python tests/catalog_test.py
          python tools/culture03_editor.py audit
          python tools/science03_verify.py
          python tools/catalog.py --stage release
          git diff --exit-code -- web/data web/js/rules.js
          node tools/modern-rounds.mjs
      - name: Browser-Testausgabe bauen
        run: node tools/package-web.mjs --pages "$RUNNER_TEMP/quizsalon/Quiz"
      - name: Handy-Ansicht und Offline-Wiederaufnahme prüfen
        run: |
          npx --no-install playwright-core install --with-deps chromium webkit
          node tests/pages-browser.mjs "$RUNNER_TEMP/quizsalon/Quiz"
          node tests/topic-cards.mjs --pages "$RUNNER_TEMP/quizsalon/Quiz" --out "$RUNNER_TEMP/qa-themenbilder"
          node tests/quick-browser.mjs "$RUNNER_TEMP/qa-kurzrunden"
          node tests/followup-browser.mjs --pages "$RUNNER_TEMP/quizsalon/Quiz" --out "$RUNNER_TEMP/qa-freunde"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/quizsalon/Quiz

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Browser-Testausgabe bereitstellen
        id: deployment
        uses: actions/deploy-pages@v5
